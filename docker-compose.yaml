services:
  postgres:
    container_name: postgres-db
    image: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: springdb
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    expose:
      - 5432
  redis:
    container_name: redis-cache
    image: redis/redis-stack
    hostname: redis
    environment:
      POSTGRES_DB: springdb
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    expose:
      - 6379
    ports:
      - "8001:8001"
    depends_on:
      - postgres
  backend:
    container_name: backend-app
    build:
      dockerfile: Dockerfile
    hostname: backend
    environment:
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    ports:
      - "8880:8080"
    depends_on:
      - postgres
      - redis